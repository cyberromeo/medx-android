name: Emulator smoke (post sign-in)

# Boots an x86_64 API 34 emulator, installs the debug APK, seeds a placeholder session with
# run-as (debug builds only) and opens every tab, then uploads logcat + screenshots.
# Builds this commit and, for comparison, main.
on:
  workflow_dispatch:
  push:
    branches: [ main, redesign-v3, feature-duels ]
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/emulator-smoke.yml'
      - '.github/scripts/smoke.sh'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [ this, main ]
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
      - uses: actions/checkout@v4
        with:
          path: src
          ref: ${{ matrix.target == 'main' && 'main' || github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: src
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/.github/scripts/smoke.sh src/app/build/outputs/apk/debug/app-debug.apk out-${{ matrix.target }}

      - name: Upload logcat and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.target }}
          path: out-${{ matrix.target }}
          if-no-files-found: warn
